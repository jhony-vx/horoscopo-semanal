name: Publish monthly zodiac forecasts

on:
  schedule:
    - cron: '0 10 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zodiac-content-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare monthly drafts
        run: node scripts/publish-periodic-content.mjs prepare-month

      - name: Validate drafts
        run: |
          npm run check
          npm run build

      - name: Publish complete monthly group
        run: node scripts/publish-periodic-content.mjs publish-month

      - name: Validate published group
        run: |
          npm run check
          npm run build

      - name: Commit and push publication
        run: |
          git add src/content/forecasts
          if git diff --cached --quiet; then
            echo "No hay cambios mensuales para publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: publica pronósticos zodiacales mensuales"
          git push origin main
